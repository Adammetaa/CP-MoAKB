services:
  - type: web
    name: cp-moakb-internal-pilot
    runtime: node
    rootDir: prototype/sp-assistant
    plan: starter
    buildCommand: npm install
    startCommand: node server.mjs
    healthCheckPath: /health
    envVars:
      - key: PILOT_HOST
        value: 0.0.0.0
      - key: PILOT_ALLOW_LAN
        value: "true"
      - key: PILOT_DB_PATH
        value: /var/data/pilot.sqlite
      - key: PILOT_EXPORT_DIR
        value: /var/data/exports
      - key: PILOT_UPLOAD_DIR
        value: /var/data/uploads
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
    disk:
      name: pilot-data
      mountPath: /var/data
      sizeGB: 1
